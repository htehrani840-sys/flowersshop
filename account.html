<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حساب کاربری | رزلند</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="site-header"></div>

<section class="acc" id="acc">
  <div class="acc-h">
    <h1>حساب کاربری من</h1>
    <p>خوش آمدید</p>
  </div>

  <div class="acc-card">
    <h2>اطلاعات حساب کاربری</h2>
    <form id="accForm" novalidate>
      <label class="arow"><span>نام و نام خانوادگی :</span><input id="aName" type="text" autocomplete="name"></label>
      <label class="arow"><span>شماره تماس :</span><input id="aPhone" type="tel" dir="ltr" inputmode="numeric" autocomplete="tel"></label>
      <label class="arow"><span>کدپستی :</span><input id="aPost" type="text" dir="ltr" inputmode="numeric" maxlength="10" autocomplete="postal-code"></label>
      <label class="arow arow-area"><span>آدرس :</span><textarea id="aAddr" autocomplete="street-address"></textarea></label>
      <em class="aerr" id="aErr" role="alert"></em>
      <button type="submit" class="asave">ذخیره اطلاعات</button>
      <button type="button" class="alogout" id="aOut">خروج از حساب</button>
    </form>
  </div>
</section>

<div id="site-footer"></div>
<script src="layout.js"></script>
<script>
const $ = s => document.getElementById(s);
const fa2en = s => s.replace(/[۰-۹]/g, d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g, d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
$("acc").style.backgroundImage = `url("${BASE}عکس صفحه حساب کاربری.png")`;

const u = getUser();
$("aName").value  = u.name  || "";
$("aPhone").value = u.phone || "";
$("aPost").value  = u.post  || "";
$("aAddr").value  = u.address || "";
if(u.name) document.querySelector(".acc-h p").textContent = "خوش آمدید " + u.name;

$("accForm").addEventListener("submit", e=>{
  e.preventDefault();
  const name = $("aName").value.trim(), phone = fa2en($("aPhone").value.trim()),
        post = fa2en($("aPost").value.trim()), addr = $("aAddr").value.trim();
  if(name.length < 3){ $("aErr").textContent = "نام و نام خانوادگی را وارد کنید."; $("aName").focus(); return; }
  if(!/^09\d{9}$/.test(phone)){ $("aErr").textContent = "شماره تماس معتبر نیست (مثال: 09120164667)."; $("aPhone").focus(); return; }
  if(post && !/^\d{10}$/.test(post)){ $("aErr").textContent = "کدپستی باید ۱۰ رقم باشد."; $("aPost").focus(); return; }
  saveUser({...getUser(), name, phone, post, address:addr, loggedIn:true});
  $("aErr").textContent = "اطلاعات شما ذخیره شد.";
  document.querySelector(".acc-h p").textContent = "خوش آمدید " + name;
});

$("aOut").onclick = () => { saveUser({...getUser(), loggedIn:false}); location.href = "index.html"; };
</script>
</body>
</html>
